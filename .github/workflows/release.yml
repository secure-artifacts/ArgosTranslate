name: Release Argos Translate

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare package layout
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install argostranslategui PyQt5 pyinstaller
          New-Item -ItemType Directory -Force -Path venv/Lib/site-packages/argostranslategui | Out-Null
          Copy-Item patches/argostranslategui_gui.py venv/Lib/site-packages/argostranslategui/gui.py

      - name: Build portable update package
        run: python tools/build_update_package.py

      - name: Build one-click setup executable
        run: python tools/build_portable_setup.py

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_final | Out-Null
          $zip = Get-ChildItem dist/update/*.zip | Select-Object -First 1
          if (-not $zip) { throw "Update zip not found" }
          Copy-Item $zip.FullName "dist_final/ArgosTranslate-${{ github.ref_name }}.zip"
          $exe = Get-ChildItem dist/ArgosTranslate.exe -ErrorAction SilentlyContinue
          if ($exe) {
            Copy-Item $exe.FullName "dist_final/ArgosTranslate-${{ github.ref_name }}.exe"
          }

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist_final/*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_final/*
          generate_release_notes: true
