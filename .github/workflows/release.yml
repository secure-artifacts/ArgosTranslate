name: Release Argos Translate

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare package layout
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install argostranslategui PyQt5 pyinstaller
          New-Item -ItemType Directory -Force -Path venv/Lib/site-packages/argostranslategui | Out-Null
          Copy-Item patches/argostranslategui_gui.py venv/Lib/site-packages/argostranslategui/gui.py

      - name: Build portable update package
        run: python tools/build_update_package.py

      - name: Build one-click setup executable
        run: python tools/build_portable_setup.py

      - name: Verify setup exe embeds payload
        run: dist/ArgosTranslate.exe --check-bundle

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_final | Out-Null
          $zip = Get-ChildItem dist/update/*.zip | Select-Object -First 1
          if (-not $zip) { throw "Update zip not found" }
          Copy-Item $zip.FullName "dist_final/ArgosTranslate-${{ github.ref_name }}.zip"
          $exe = Get-ChildItem dist/ArgosTranslate.exe -ErrorAction SilentlyContinue
          if ($exe) {
            Copy-Item $exe.FullName "dist_final/ArgosTranslate-${{ github.ref_name }}.exe"
          }
          $wheels = Get-ChildItem dist/*-install_wheels.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wheels) {
            Copy-Item $wheels.FullName "dist_final/install_wheels-${{ github.ref_name }}.zip"
          }

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist_final/*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_final/*
          generate_release_notes: true
          body: |
            ## 安装（新用户）

            **只需下载 `ArgosTranslate-*.exe`**，双击后选择安装目录即可完整安装。
            程序文件已内嵌在安装包中，**无需**再下载 zip。

            首次双击 exe 约 30 秒～2 分钟会出现启动提示（exe 体积已缩小）；安装过程中会自动下载离线依赖包（约 200MB，需联网）。

            完整安装约 15～40 分钟（含语言包；pip 阶段可能长时间无新进度）。

            ## zip 更新包

            `ArgosTranslate-*.zip` 供**已安装用户**在软件内「检查更新」时自动下载，新用户请忽略。
